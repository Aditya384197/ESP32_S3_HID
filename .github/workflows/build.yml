name: Build ESP32 Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Platform
        run: |
          mkdir -p /home/runner/.arduino15
          echo "board_manager:" > /home/runner/.arduino15/arduino-cli.yaml
          echo "  additional_urls:" >> /home/runner/.arduino15/arduino-cli.yaml
          echo "    - https://githubusercontent.com" >> /home/runner/.arduino15/arduino-cli.yaml
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Compile ESP32-S3 USB HID
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32s3 \
            --build-property "build.extra_flags=-DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=0" \
            --output-dir ./build/s3 \
            ./ESP32_S3_HID/ESP32_S3_HID.ino

      - name: Upload ESP32-S3 Binary
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-S3-USB-Firmware
          path: ./build/s3/*.bin
