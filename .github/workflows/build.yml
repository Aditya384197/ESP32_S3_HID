name: Build ESP32 Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Platform
        run: |
          # 1. arduino-cli का एक नया और फ्रेश कॉन्फ़िगरेशन जनरेट करें
          arduino-cli config init --overwrite
          
          # 2. पुरानी सभी गलत यूआरएल सेटिंग्स को हटाकर बिल्कुल सही यूआरएल सेट करें
          arduino-cli config set board_manager.additional_urls https://githubusercontent.com
          
          # 3. अब फ्रेश इंडेक्स अपडेट करें
          arduino-cli core update-index
          
          # 4. कोर इंस्टॉल करें
          arduino-cli core install esp32:esp32

      - name: Install Bluetooth Keyboard Library
        run: |
          mkdir -p "$HOME/Arduino/libraries"
          git clone https://github.com "$HOME/Arduino/libraries/ESP32-BLE-Keyboard"

      - name: Compile ESP32-S3 USB HID
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32s3 \
            --build-property "build.extra_flags=-DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=0" \
            --output-dir ./build/s3 \
            ./ESP32_S3_HID/ESP32_S3_HID.ino

      - name: Compile Normal ESP32 Bluetooth HID
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32 \
            --output-dir ./build/ble \
            ./ESP32_BLE_HID/ESP32_BLE_HID.ino

      - name: Upload ESP32-S3 Binary
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-S3-USB-Firmware
          path: ./build/s3/*.bin

      - name: Upload Normal ESP32 BLE Binary
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-Normal-BLE-Firmware
          path: ./build/ble/*.bin
